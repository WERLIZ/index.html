<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SAMP CEF Logo Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent !important; /* Mohimm bzaf bach l-game t-ban mor l-logo */
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        
        /* l-7awia l-asasiya dyal l-logo o l-khatt */
        .logo-container {
            position: absolute;
            top: 20px;      /* l-massafe mn l-foq */
            right: 20px;    /* l-massafe mn l-ymin (top-right) */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            
            /* l-animation dyal l-ikhtifae o l-dohoor l-hadia (yban o ymchi) */
            animation: slowFadeInOut 6s ease-in-out infinite;
            will-change: opacity, transform;
        }

        /* tsouira dyal l-logo m3a animation d l-3afya l-zarqa (flicker) */
        .logo-container img {
            width: 120px;   /* kber aw sgher l-logo mn hna */
            height: auto;
            
            /* l-animation dyal tawahoj l-3afya (flicker) sriaa o khfefa */
            animation: blueFlameFlicker 0.15s infinite alternate;
            will-change: filter;
        }

        /* l-khatt l-moudie l-zraq taht l-logo bhal l-3afya */
        .glow-line {
            width: 90px;
            height: 2px;
            /* gradient l-alwan l-zarqa nfsha dyal l-logo */
            background: linear-gradient(90deg, transparent, #0088ff, #00d2ff, #0088ff, transparent);
            margin-top: 8px;
            border-radius: 50%;
            
            /* animation dyal tawahoj l-khatt bhal l-3afya */
            animation: lineFlameEffect 0.2s infinite alternate;
            will-change: box-shadow, transform;
        }

        /* 1. Animation dyal l-ikhtifae o l-dohoor m3a sway d l-tala3 o l-habte */
        @keyframes slowFadeInOut {
            0%, 100% {
                opacity: 0.1; /* kyakhtafi ta9riban b l-kamal */
                transform: translateY(0) scale(0.96);
            }
            50% {
                opacity: 1; /* kayban b l-kamal */
                transform: translateY(-6px) scale(1.04);
            }
        }

        /* 2. Animation dyal tawahoj l-logo bhal l-3afya l-zarqa l-flickering */
        @keyframes blueFlameFlicker {
            0% {
                filter: drop-shadow(0 -2px 5px rgba(0, 136, 255, 0.7)) 
                        drop-shadow(1px -4px 10px rgba(0, 210, 255, 0.5));
            }
            50% {
                filter: drop-shadow(0 -3px 8px rgba(0, 136, 255, 0.9)) 
                        drop-shadow(-1px -8px 18px rgba(0, 210, 255, 0.7));
            }
            100% {
                filter: drop-shadow(0 -1px 4px rgba(0, 136, 255, 0.6)) 
                        drop-shadow(2px -5px 12px rgba(0, 210, 255, 0.4));
            }
        }

        /* 3. Animation dyal tawahoj l-khatt o t-tamawuj dyalo */
        @keyframes lineFlameEffect {
            0% {
                box-shadow: 0 0 6px rgba(0, 136, 255, 0.7), 0 0 12px rgba(0, 210, 255, 0.5);
                transform: scaleX(0.95);
            }
            100% {
                box-shadow: 0 0 10px rgba(0, 136, 255, 1), 0 0 20px rgba(0, 210, 255, 0.8);
                transform: scaleX(1.05);
            }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- 7et hna l-link dyal tsouira dyal l-logo dyalk -->
        <img src="https://cdn.discordapp.com/emojis/1534686292196200478.webp?size=96" alt="Logo">
        
        <!-- l-khatt l-moudie l-zraq taht l-logo -->
        <div class="glow-line"></div>
    </div>

</body>
</html>
